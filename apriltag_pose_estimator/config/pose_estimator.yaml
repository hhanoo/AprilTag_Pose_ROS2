pose_estimator_node:
  ros__parameters:
    # =========================================================
    # AprilTag Configuration (Common)
    # =========================================================
    tag_size: 0.02778                   # Tag size in meters (27.78mm)
    tag_family: 'tagStandard41h12'      # AprilTag family

    # =========================================================
    # Input Topics (Subscribe)
    # =========================================================
    camera_topic: 'camera/color/image_raw'         # Camera image input
    camera_info_topic: 'camera/color/camera_info'  # Camera info input
    camera_frame: 'camera_color_optical_frame'     # Camera optical frame

    # =========================================================
    # Distortion Handling
    #   false: Use rectified images (no distortion)
    #   true : Use raw images and apply PnP with distortion from camera_info
    # =========================================================
    use_distortion_from_camera_info: false

    # =========================================================
    # Output Topics (Publish)
    # =========================================================
    tag_detection_topic:   'pose_estimator_node/tag_detections'    # Raw detection (debug, single rvec/tvec)
    target_poses_topic:    'pose_estimator_node/target_poses'      # PoseArray in group_names order
    group_names_topic:     'pose_estimator_node/group_names'       # CSV, latched (transient_local) for late joiners
    group_status_topic:    'pose_estimator_node/group_status'      # UInt8MultiArray (0/1 per group)
    detection_image_topic: 'pose_estimator_node/detection_image'   # BGR8 overlay

    # =========================================================
    # Publishing Options
    # =========================================================
    publish_detection_image: true    # Publish detection image (If no subscriber exists, skip automatically)

    # =========================================================
    # Service Options
    # =========================================================
    show_service_result_window: false # Show OpenCV window on service call (set false in Docker/headless)
    display_width: 0                  # Display window width (0 = original size)
    display_height: 0                 # Display window height (0 = original size)

    # =========================================================
    # Multi-Group Configuration
    # - group_names order defines PoseArray / group_status publish order.
    # =========================================================
    group_names:
      - default
      - secondary

    # Each group's output pose = base marker pose in camera frame (one Pose per group).
    groups:
      default:
        marker_ids: [0, 1, 2]
        base_marker_id: 1
        # Marker Offsets (per-marker 6-DoF, base_marker frame)
        # - 6 values per marker, ordered as marker_ids [x, y, z, roll, pitch, yaw] (m, rad)
        # - R = Rz(yaw) * Ry(pitch) * Rx(roll)
        marker_offsets: [
          -0.065,  0.000,  0.000,   0.0000,  0.0000,  0.0000,   # marker 0
           0.000,  0.000,  0.000,   0.0000,  0.0000,  0.0000,   # marker 1 (base)
           0.065,  0.000,  0.000,   0.0000,  0.0000,  0.0000,   # marker 2
        ]

      secondary:
        marker_ids: [10, 11, 12]
        base_marker_id: 11
        marker_offsets: [
          -0.065,  0.000,  0.000,   0.0000,  0.0000,  0.0000,   # marker 10
           0.000,  0.000,  0.000,   0.0000,  0.0000,  0.0000,   # marker 11 (base)
           0.065,  0.000,  0.000,   0.0000,  0.0000,  0.0000,   # marker 12
        ]