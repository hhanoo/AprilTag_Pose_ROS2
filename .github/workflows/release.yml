# =============================================================================
# 태그(v*) push 시 자동으로 GitHub Release를 생성하는 워크플로우
# 사용법: git tag v1.0.0 && git push origin v1.0.0
# 결과: GitHub Release 페이지에 릴리즈가 생성되고, 소스코드 zip/tar.gz가 자동 첨부됨
# =============================================================================
name: Release

# 워크플로우 트리거 조건
# push 이벤트 중 "v"로 시작하는 태그가 push될 때만 실행
# 예: v1.0.0, v2.1.3, v0.0.1-beta 등
on:
  push:
    tags:
      - "v*"

# GitHub Actions에 부여할 권한 설정
# contents: write → 리포지토리에 릴리즈를 생성할 수 있는 쓰기 권한
permissions:
  contents: write

jobs:
  release:
    # 워크플로우를 실행할 가상 머신 환경 (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      # 1단계: 소스코드 체크아웃
      # 리포지토리의 코드를 가상 머신에 클론
      - uses: actions/checkout@v4

      # 2단계: GitHub Release 생성
      # softprops/action-gh-release: 가장 널리 사용되는 릴리즈 생성 액션
      # - 태그 이름을 릴리즈 제목으로 사용
      # - 소스코드 zip/tar.gz는 GitHub가 자동으로 첨부
      # - 별도 토큰 설정 없이 기본 GITHUB_TOKEN으로 동작
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # 이전 태그 이후의 커밋 목록과 PR 기반으로 릴리즈 노트를 자동 생성
          generate_release_notes: true
